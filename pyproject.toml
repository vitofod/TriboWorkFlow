[build-system]
requires = ['setuptools >= 64']
build-backend = 'setuptools.build_meta'

[project]
name = 'TriboWorkFlow'
description = 'Conservative port of the TribChem workflows to Quantum ESPRESSO, MLIPs and CP2K, without MongoDB, FireWorks and atomate.'
dynamic = ['version']
authors = [
    { name = 'Vito Foderà', email = 'vitofode87@gmail.com' },
]
requires-python = '>=3.12'
# Hard constraints only: the exact versions of every package are in
# envs/dev/requirements.lock (see envs/README.md).
dependencies = [
    # TribChem's upper bound.
    'numpy>=1.26.4,<2',
    # 1.14.0 removed scipy.integrate.simps, used by TribChem's charge analyzer.
    'scipy>=1.13.1,<1.14',
    # Interface matching (ZSLGenerator) and adsorption sites as in TribChem.
    'pymatgen==2024.6.10',
    # Same version as Xsorb, whose ASE calculator uses private ASE symbols.
    'ase==3.26.0',
]
# Licence still to be decided; third-party licences are listed in NOTICE.
classifiers = [
    'Development Status :: 2 - Pre-Alpha',
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3.12',
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering :: Physics',
    'Private :: Do Not Upload',
]

[project.optional-dependencies]
# Filled in phase 5 (MLIP) and phase 6 (CP2K).
mlip = []
cp2k = []
dev = ['pytest']

[tool.setuptools.dynamic]
version = {attr = 'triboworkflow.__version__'}

[tool.setuptools.packages.find]
include = ['triboworkflow*']

[tool.pytest.ini_options]
testpaths = ['tests']
addopts = '-ra'
