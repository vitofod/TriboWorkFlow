# Author: Vito Foderà
# Created: 2026-10-23
#
# Settings for the interface workflow: complete example.
#
# The numbers are illustrative, not recommended values. The namelists and
# the species are the template of every pw.x input of the workflow: the
# namelist keys are written as given, and keys left out take the pw.x
# defaults. calculation, prefix, outdir, title and restart_mode are set by
# the code for every calculation and must not be given here.
# Field reference: docs/configuration.md.

schema_version = 1

[interface]
# Steps to run, required: any of match, pes, pes_scf, plotpes, plotpes_scf,
# shear, adhesion, ppes, charge. Each runs once the steps it needs are done;
# between steps that are ready, the order of this list decides. pes is the
# potential energy surface relaxed along z, pes_scf the static one: two steps,
# run when listed, also both. plotpes interpolates pes and plotpes_scf
# interpolates pes_scf; in this version they are analysed only by hand
# ("triboworkflow analyse plotpes"), where there is enough memory.
steps = ["match", "pes", "pes_scf", "plotpes", "plotpes_scf", "shear", "adhesion", "ppes", "charge"]
engine = "qe"                      # Engine of the steps that run calculations.
# engines = { pes = "qe" }         # Per-step engine: pes, pes_scf, adhesion, ppes, charge.
set_bm = true                      # Strain weights = bulk moduli of the two materials.

# The two slabs; the interface id is mid1_mid2. The slab on top is the one
# whose formula and Miller indices come first alphabetically (here Al(111)),
# whatever the order of this list. formula and name are given for both slabs
# or for neither: here the interface takes Cu_Al and Cu111-Al111 from the slabs.
[[interface.slabs]]
file = "slabs/Cu111.extxyz"
mid = "mp-30"
# formula = "Cu"
# name = "Cu-fcc"                  # Tells apart homonyms.
miller = [1, 1, 1]
bulk_modulus = 140.0               # GPa, bulk modulus of the material.

[[interface.slabs]]
file = "slabs/Al111.extxyz"
mid = "mp-134"
miller = [1, 1, 1]
bulk_modulus = 76.0                # GPa

[interface.inter_params]           # Missing keys take the defaults (docs/configuration.md).
max_area = 160.0                   # angstrom^2; enlarged, with the length and area ratio
                                   # tolerances, at every new attempt of the matching.
interface_distance = 2.0           # angstrom
# max_angle_tol = 0.4              # Default; the same value at every attempt.
max_length_tol = 0.02
max_area_ratio_tol = 0.05
best_match = "area"                # The only criterion: the match of smallest area.

# Static PES (step pes_scf): complete slabs, or slabs reduced to their layers
# next to the interface. The relaxed PES (step pes) always uses the complete
# slabs and has no table.
[interface.pes_scf]
short = false                      # Default: complete slabs.
# layers = [3, 2]                  # With short = true: layers kept in the bottom and in the
                                   # top slab; by default 3 for a (111) slab, 2 for the others.

# Adhesion (step adhesion): the surface that gives the minimum and the maximum,
# and the slabs of the four calculations. One choice for the whole run; the
# step waits for the surface that it names.
[interface.adhesion]
pes = "pes"                        # Default: pes (relaxed along z) or pes_scf (static).
type = "regular"                   # Default: regular; short only with pes = "pes_scf" and
                                   # short = true in [interface.pes_scf].

# Perpendicular PES (step ppes): the interface relaxed by the adhesion (of the
# kind chosen in [interface.adhesion]) with the top slab moved along z, rigidly,
# one calculation per shift. One site per run: change site and run again to
# compute the other. It needs [k_points] with mode = "kdens".
[interface.ppes]
site = "min_site"                  # Default: min_site or max_site, the interface at the minimum
                                   # or at the maximum of the surface.
# shifts = [-0.75, -0.5, -0.25, 0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.75, 3.0]
                                   # Default, angstrom: 15 values from -0.75 to 3 that skip 2.5.
fit = "none"                       # Default: none (energies only) or uber (also g, in eV per cell,
                                   # and l, in angstrom, with their deviations).

# Charge displacement (step charge): the charge density of the interface relaxed by
# the adhesion (of the kind chosen in [interface.adhesion]) and of its two slabs, in
# the same cell, computed by pp.x after each pw.x (it needs pp_command in [execution]
# and [k_points] with mode = "kdens"). One site per run: change site and run again to
# compute the other.
[interface.charge]
site = "min_site"                  # Default: min_site or max_site, the interface at the minimum
                                   # or at the maximum of the surface.
# operations = ["-", "-"]          # Default: the interface minus the bottom slab minus the top
                                   # slab; each one "+" or "-". Changing them computes nothing again.

[namelists.CONTROL]
nstep = 150                        # Relax; recommended 150, at most 250. Raised by the relaunches.
max_seconds = 84600                # Seconds; upper limit of the value set from the walltime left.
tstress = false
tprnfor = true
pseudo_dir = "/path/to/pseudo"
disk_io = "low"
etot_conv_thr = 1.0e-4             # Ry
forc_conv_thr = 1.0e-3             # Ry/bohr

[namelists.SYSTEM]
ecutwfc = 50.0                     # Ry
ecutrho = 400.0                    # Ry
occupations = "smearing"
degauss = 0.01                     # Ry
smearing = "mv"
nspin = 2
vdw_corr = "none"
# Grimme-D2 instead; the other keys are optional, as in pw.x. The index of
# london_c6 and london_rvdw is the position in [[atomic_species]].
# vdw_corr = "grimme-d2"
# london_s6 = 0.75
# london_rcut = 200.0              # bohr
# "london_c6(1)" = 159.927         # Ry*bohr^6 (pw.x value for Ar)
# "london_rvdw(1)" = 3.014         # bohr (pw.x value for Ar)

[namelists.ELECTRONS]
electron_maxstep = 200
conv_thr = 1.0e-6                  # Ry
mixing_mode = "local-TF"
mixing_beta = 0.4                  # Recommended 0.4, at least 0.1. Lowered by the relaunches.

[[atomic_species]]
label = "Cu"
mass = 63.546
pseudopotential = "Cu.UPF"
starting_magnetization = 0.5

[[atomic_species]]
label = "Al"
mass = 26.982
pseudopotential = "Al.UPF"
starting_magnetization = 0.5

[k_points]
mode = "kdens"                     # Grid from the density, once the cell is known.
kdens = 7.5                        # k-points per 1/angstrom of each reciprocal vector.

# The pw.x expected on the HPC. Without upf_md5 the calculations are prepared
# and run, but their results are never reused and their energies never
# combined automatically.
[qe]
version = "7.2"                    # Required: 7.1 | 7.2 | 7.3, compared with the output.
upf_md5 = "pseudo.md5"             # Expected MD5 of the UPF files, relative to this file;
                                   # made with: md5sum *.UPF > pseudo.md5 (in pseudo_dir).

[execution]
scheduler = "slurm"
jobscript = "jobscript.sh"         # Relative to this file; copied with the worker line added.
run_command = "mpirun -np 32 pw.x -nk 4"
# pp_command = "mpirun -np 32 pp.x"  # Required by the calculations that give the charge
                                     # density (charge): pp.x after pw.x, in the same job.
groups = 10                        # Jobs (workers); never more than the calculations.
                                   # Optional: else --groups, or asked in a terminal.
walltime = 86400                   # Seconds, as in the jobscript.
polling_interval = 1800            # Seconds between two checks of the jobs.
max_seconds_margin = 600           # Seconds kept free at the end of the walltime.
job_report_wait = 3600             # Seconds a submitted job may stay unreported by the scheduler.

# Job of the interpolation of the PES (plotpes, plotpes_scf), which can need tens
# of GiB on large interfaces: never run by the orchestrator. With this table the
# orchestrator submits it on a compute node and follows it; without it those steps
# wait to be analysed by hand (triboworkflow analyse plotpes).
# [execution.analysis]
# jobscript = "analysis.sh"        # Relative to this file; copied with the analysis line added.
#                                  # Memory, walltime and partition in its #SBATCH lines.
