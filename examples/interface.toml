# Author: Vito Foderà
# Created: 2026-10-23
#
# Settings for the interface workflow: complete example.
#
# The numbers are illustrative, not recommended values. The namelists and
# the species are the template of every pw.x input of the workflow: the
# namelist keys are written as given, and keys left out take the pw.x
# defaults. calculation, prefix, outdir, title and restart_mode are set by
# the code for every calculation and must not be given here.
# Field reference: docs/configuration.md.

[interface]
# Steps to run, required: any of match, pes, pes_scf, plotpes, plotpes_scf,
# shear, adhesion, ppes, charge. Each runs once the steps it needs are done;
# between steps that are ready, the order of this list decides. pes is the
# potential energy surface relaxed along z, pes_scf the static one: two steps,
# run when listed, also both. plotpes interpolates pes and plotpes_scf
# interpolates pes_scf; shear reads the interpolation of plotpes. The three are
# analysed in a job of their own (see [execution.analysis]) or by hand
# ("triboworkflow analyse plotpes"), where there is enough memory.
steps = ["match", "pes", "pes_scf", "plotpes", "plotpes_scf", "shear", "adhesion", "ppes", "charge"]
engine = "qe"                      # Engine of the steps that run calculations.
# engines = { pes = "qe" }         # Per-step engine: pes, pes_scf, adhesion, ppes, charge.
set_bm = true                      # Strain weights = bulk moduli of the two materials.

# The two slabs. id names a slab (letters, digits, "-" and ".", no "_"); the
# system is <id1>_<id2>, here Cu111_Al111, the folder systems/Cu111_Al111. The
# slab on top is the one whose formula and Miller indices come first
# alphabetically (here Al(111)), whatever the order of this list. formula and
# name are given for both slabs or for neither: here the interface takes Cu_Al
# and Cu111-Al111 from the slabs.
[[interface.slabs]]
file = "slabs/Cu111.extxyz"
id = "Cu111"
# formula = "Cu"
# name = "Cu-fcc"                  # Tells apart homonyms.
miller = [1, 1, 1]
bulk_modulus = 140.0               # GPa, bulk modulus of the material.

[[interface.slabs]]
file = "slabs/Al111.extxyz"
id = "Al111"
miller = [1, 1, 1]
bulk_modulus = 76.0                # GPa

[interface.inter_params]           # Missing keys take the defaults (docs/configuration.md).
max_area = 160.0                   # angstrom^2; enlarged, with the length and area ratio
                                   # tolerances, at every new attempt of the matching.
interface_distance = 2.0           # angstrom
# max_angle_tol = 0.4              # Default; the same value at every attempt.
max_length_tol = 0.02
max_area_ratio_tol = 0.05
best_match = "area"                # The only criterion: the match of smallest area.

# Static PES (step pes_scf): complete slabs, or slabs reduced to their layers
# next to the interface. The relaxed PES (step pes) always uses the complete
# slabs and has no table.
[interface.pes_scf]
short = false                      # Default: complete slabs.
# layers = [3, 2]                  # With short = true: layers kept in the bottom and in the
                                   # top slab; by default 3 for a (111) slab, 2 for the others.

# Adhesion (step adhesion): the surface that gives the minimum and the maximum,
# and the slabs of the four calculations. One choice for the whole run; the
# step waits for the surface that it names.
[interface.adhesion]
pes = "pes"                        # Default: pes (relaxed along z) or pes_scf (static).
type = "regular"                   # Default: regular; short only with pes = "pes_scf" and
                                   # short = true in [interface.pes_scf].

# Perpendicular PES (step ppes): the interface relaxed by the adhesion (of the
# kind chosen in [interface.adhesion]) with the top slab moved along z, rigidly,
# one calculation per shift. One site per run: change site and run again to
# compute the other. It needs [k_points] with mode = "kdens".
[interface.ppes]
site = "min_site"                  # Default: min_site or max_site, the interface at the minimum
                                   # or at the maximum of the surface.
# shifts = [-0.75, -0.5, -0.25, 0.0, 0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 1.75, 2.0, 2.25, 2.5, 2.75, 3.0]
                                   # Default, angstrom: 16 values from -0.75 to 3, a step of 0.25.
fit = "none"                       # Default: none (energies only) or uber (also g, in eV per cell,
                                   # and l, in angstrom, with their deviations).

# Charge displacement (step charge): the charge density of the interface relaxed by
# the adhesion (of the kind chosen in [interface.adhesion]) and of its two slabs, in
# the same cell, computed by pp.x after each pw.x (it needs pp_command in [execution]
# and [k_points] with mode = "kdens"). One site per run: change site and run again to
# compute the other.
[interface.charge]
site = "min_site"                  # Default: min_site or max_site, the interface at the minimum
                                   # or at the maximum of the surface.
# operations = ["-", "-"]          # Default: the interface minus the bottom slab minus the top
                                   # slab; each one "+" or "-". Changing them computes nothing again.

# Shear strength (step shear): three minimum energy paths of the surface that plotpes
# interpolated (the relaxed one), from the best straight line, the axis x and the axis y of
# the cell. The values of both tables are the recommended ones, which are also the defaults;
# the step tells which parameters of a run differ. Changing any of them computes the shear
# strength again. It is analysed in a job of its own (see [execution.analysis]) or by hand
# ("triboworkflow analyse shear").
[interface.shear]
delta = 0.01                       # Default: step (angstrom) of the derivative along each path,
                                   # which gives the force and the shear strength.
seed = 0                           # Default: seed of the noise of the best straight line
                                   # (0 to 4294967295).

[interface.shear.mep]              # String method, the same for the three paths.
npts = 101                         # Default: points of the string (at least 6).
extent = [1.5, 1.5]                # Default: extent of the starting string along x and y, in
                                   # lengths of the cell.
h = 0.01                           # Default: time step.
nstepmax = 99999                   # Default: maximum number of steps.
tol = 1.0e-8                       # Default: mean displacement of the string that stops it.
delta = 1.0e-4                     # Default: step (angstrom) of the derivative of the surface
                                   # inside the method; not the delta above.

[namelists.CONTROL]
nstep = 150                        # Relax; recommended 150, at most 250. Raised by the relaunches.
tstress = false
tprnfor = true
pseudo_dir = "/path/to/pseudo"
disk_io = "low"
etot_conv_thr = 1.0e-4             # Ry
forc_conv_thr = 1.0e-3             # Ry/bohr

[namelists.SYSTEM]
ecutwfc = 50.0                     # Ry
ecutrho = 400.0                    # Ry
occupations = "smearing"
degauss = 0.01                     # Ry
smearing = "mv"
nspin = 2
vdw_corr = "none"
# Grimme-D2 instead; the other keys are optional, as in pw.x. The index of
# london_c6 and london_rvdw is the position in [[atomic_species]].
# vdw_corr = "grimme-d2"
# london_s6 = 0.75
# london_rcut = 200.0              # bohr
# "london_c6(1)" = 159.927         # Ry*bohr^6 (pw.x value for Ar)
# "london_rvdw(1)" = 3.014         # bohr (pw.x value for Ar)

[namelists.ELECTRONS]
electron_maxstep = 200
conv_thr = 1.0e-6                  # Ry
mixing_mode = "local-TF"
mixing_beta = 0.4                  # Recommended 0.4, at least 0.1. Lowered by the relaunches.

# mass and pseudopotential can be "auto": read from the ATOMIC_SPECIES of the slab files, when
# they are inputs or outputs of pw.x (docs/configuration.md). The order of the species is yours.
[[atomic_species]]
label = "Cu"
mass = 63.546
pseudopotential = "Cu.UPF"
starting_magnetization = 0.5

[[atomic_species]]
label = "Al"
mass = 26.982
pseudopotential = "Al.UPF"
starting_magnetization = 0.5

[k_points]
mode = "kdens"                     # Grid from the density, once the cell is known.
kdens = 7.5                        # k-points per 1/angstrom of each reciprocal vector.

# The pw.x expected on the HPC. The pseudopotentials are told apart by the
# name of their UPF file, as given in [[atomic_species]].
[qe]
version = "7.2"                    # Required: 7.1 | 7.2 | 7.3, compared with the output.

# The MLIP model, for the calculations that use one. Read and checked, but no step uses it yet:
# the engines above are still qe only.
# [mlip]
# type = "MACE_MP"                 # DP | MACE | MACE_MP, written whole.
# path = "/path/to/mace-omat-0-medium.model"   # Absolute; on the machine that runs the calculations.
# version = "0.3.14"               # Version of the package that loads the model; optional.
# kwargs = { default_dtype = "float64", head = "Omat24" }   # Passed to the loader as written.
#                                  # device is cuda and cannot be given; default_dtype is
#                                  # required by MACE and MACE_MP with ASE.
# fmax = 0.01                      # Default: eV/angstrom.
# maxsteps = 500                   # Default.

[execution]
scheduler = "slurm"
jobscript = "jobscript.sh"         # Relative to this file; copied for every job, with the
                                   # worker or analysis line added. Resources and environment
                                   # only: walltime and name of the jobs come from here.
run_command = "mpirun -np 32 pw.x -nk 4"
# pp_command = "mpirun -np 32 pp.x"  # Required by the calculations that give the charge
                                     # density (charge): pp.x after pw.x, in the same job.
groups = 10                        # Jobs (workers) per group of the steps without groups in
                                   # their section; never more than the calculations.
                                   # Optional: else --groups, or asked in a terminal.
polling_interval = 1800            # Seconds between two checks of the jobs.
max_seconds_margin = 600           # Seconds kept free at the end of the walltime; below the
                                   # walltime of every step that runs calculations. pw.x gets
                                   # max_seconds from these: not in [namelists.CONTROL].
job_report_wait = 3600             # Seconds a submitted job may stay unreported by the scheduler.
# max_jobs = 4                     # Most jobs of this run in the scheduler at the same time (a
                                   # queue that limits the jobs of a user, e.g. a debug QoS): the
                                   # others are submitted at the next checks. Default: no limit.

# The jobs of each step, in a section of its own. walltime: "HH:MM:SS" (hours may pass 24,
# e.g. "48:00:00"), given to the submission of every job of the step (sbatch --time, qsub
# -l walltime or h_rt, bsub -W; none with HTCondor), in place of a --time of the
# jobscripts. A step run without a walltime gets 24:00:00, with a warning from check,
# start and the log: a queue with a shorter limit (e.g. a debug QoS of 30 min) refuses
# those jobs. groups: jobs (workers) per group of the step, for the steps that run
# calculations; else [execution].groups; --groups holds for every step. plotpes,
# plotpes_scf and shear run in one job each. A section of a step that is not run has no
# effect. The jobs are named <step>_<name>, <name> being the --job-name of the jobscript
# (else the system): ppes_testFe. submit_options: options given as they are to the command
# that submits each job of the step, in the syntax of the scheduler, over the lines of the
# jobscript that set the same thing (it cannot remove a line): the queue of a step without
# another jobscript. Not --time: the time limit is the walltime.
[execution.pes]
walltime = "12:00:00"
groups = 6
# submit_options = ["--qos=boost_qos_dbg"]

[execution.pes_scf]
walltime = "04:00:00"

[execution.adhesion]
walltime = "12:00:00"
groups = 4

[execution.ppes]
walltime = "04:00:00"

[execution.charge]
walltime = "04:00:00"
groups = 1

[execution.plotpes]
walltime = "00:30:00"

[execution.plotpes_scf]
walltime = "00:30:00"

[execution.shear]
walltime = "00:30:00"

# Jobscript or submission options of the analyses in a job (plotpes and plotpes_scf, which can
# need tens of GiB on large interfaces; shear, which takes long): never run by the
# orchestrator, always in a job of their own on a compute node. Without this table they use
# the jobscript of [execution]; with it, a lighter one (they run Python only: one GPU is
# enough where the partition asks for one, e.g. #SBATCH --gres=gpu:1) or another queue.
# [execution.analysis]
# jobscript = "analysis.sh"        # Optional. Relative to this file; copied with the analysis
#                                  # line added. Memory and partition in its #SBATCH lines; the
#                                  # walltime is the one of the step in its section above.
# submit_options = ["--gres=gpu:1", "--mem=0"]   # Optional. Over the lines of the jobscript,
#                                  # before the submit_options of each step.
